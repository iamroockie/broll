[package]
name = "broll"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.0", features = ["derive"] }
config = "0.15.22"
rand = "0.10.1"
rand_distr = "0.6.0"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
